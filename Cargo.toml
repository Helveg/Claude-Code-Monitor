[package]
name = "claude-manager"
version = "1.4.0"
edition = "2021"
license = "MIT"
description = "Claude Manager — multi-session dashboard and usage monitor for Claude Code. Forked from Claude Code Usage Monitor by Code Zeno."
authors = ["Robin De Schepper <robin.deschepper93@gmail.com>"]
default-run = "claude-manager"

[package.metadata.winres]
CompanyName = "Robin De Schepper"
ProductName = "Claude Manager"
FileDescription = "Claude Manager"
OriginalFilename = "claude-manager.exe"
InternalName = "ClaudeManager"
Comments = "Forked from Claude Code Usage Monitor by Code Zeno"
LegalCopyright = "Copyright (C) 2026 Robin De Schepper. Forked from Code Zeno Pty Ltd."

[dependencies]
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Storage_FileSystem",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
