name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual run reason (optional, just for traceability)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # Cache target/ + cargo registry across runs. Saves ~2 minutes on
      # incremental rebuilds; first run on a fresh runner is cold.
      - uses: Swatinem/rust-cache@v2

      # cargo-wix v0.3.x speaks WiX 3 (candle.exe / light.exe). The
      # Microsoft package needs admin to install on a dev machine, but
      # the official portable zip works fine on the GitHub runner —
      # extract it anywhere and put it on PATH.
      - name: Install WiX 3.14 (portable)
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          $dir = "$env:RUNNER_TEMP\wix3"
          Write-Host "Downloading WiX 3.14..."
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\wix.zip" -UseBasicParsing
          Expand-Archive -Path "$env:RUNNER_TEMP\wix.zip" -DestinationPath $dir -Force
          "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Installed: $dir"

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      - name: Run unit tests
        run: cargo test --lib --no-fail-fast

      - name: Build MSI (also produces the release binaries)
        run: cargo wix --nocapture

      - name: List build outputs
        shell: pwsh
        run: |
          Write-Host "MSI:"
          Get-ChildItem target\wix\*.msi | Select-Object Name, Length, LastWriteTime
          Write-Host ""
          Write-Host "Binaries:"
          Get-ChildItem target\release\claude-manager.exe, target\release\claude.exe | Select-Object Name, Length

      # Always upload artifacts — useful for testing PRs / manual runs
      # without cutting a release.
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-manager-msi
          path: target/wix/claude-manager-*.msi

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: claude-manager-binaries
          path: |
            target/release/claude-manager.exe
            target/release/claude.exe

      # Only attach to a GitHub Release on tag push. Manual runs and
      # future branch CI invocations skip this step entirely.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/wix/claude-manager-*.msi
            target/release/claude-manager.exe
            target/release/claude.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
